services:
  - type: web
    name: attendance-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "120"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: FACE_DATASET_DIR
        value: /opt/render/project/src/backend/dataset
      - key: YOLO_FACE_MODEL
        value: https://github.com/akanametov/yolo-face/releases/download/1.0.0/yolov11n-face.pt
      - key: YOLO_FACE_CONFIDENCE
        value: "0.35"
      - key: YOLO_FACE_IMAGE_SIZE
        value: "640"
    disk:
      name: attendance-dataset
      mountPath: /opt/render/project/src/backend/dataset
      sizeGB: 1
